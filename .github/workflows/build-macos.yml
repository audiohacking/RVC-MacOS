name: Build macOS App

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        brew install portaudio
        
    - name: Create virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        
    - name: Install Python dependencies
      run: |
        source .venv/bin/activate
        pip install -r requirements/gui.txt
        pip install py2app
        
    # NOTE: Models are NOT downloaded during build
    # They will be downloaded by users on first app launch
    # This keeps the DMG size at ~500MB instead of ~3GB
        
    - name: Build application
      run: |
        source .venv/bin/activate
        python setup.py py2app
        
    - name: Create DMG
      run: |
        ./create_dmg.sh
        
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Use version exactly as provided from dispatch event
          TAG_NAME="${{ github.event.inputs.version }}"
          # Remove 'v' prefix for VERSION if present
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
        else
          # Extract from release tag
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
        fi
        
    - name: Upload to Release
      run: |
        # Check if DMG files exist
        if ! ls dist/*.dmg 1> /dev/null 2>&1; then
          echo "Error: No DMG files found in dist/ directory"
          exit 1
        fi
        
        if [ "${{ github.event_name }}" == "release" ]; then
          # Upload to the release that triggered this workflow
          echo "Uploading to release ${{ steps.get_version.outputs.TAG_NAME }}..."
          gh release upload "${{ steps.get_version.outputs.TAG_NAME }}" dist/*.dmg --clobber
        else
          # For workflow_dispatch, try to find matching release
          TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Found release $TAG_NAME, uploading artifacts..."
            gh release upload "$TAG_NAME" dist/*.dmg --clobber
          else
            echo "Warning: No release found for $TAG_NAME"
            echo "Artifacts will be available as workflow artifacts only"
          fi
        fi
      env:
        # GH_TOKEN is the environment variable expected by the gh CLI
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RVC-MacOS-${{ steps.get_version.outputs.VERSION }}
        path: |
          dist/*.dmg
          dist/*.app
        retention-days: 30
